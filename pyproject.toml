[project]
name = "agent-census"
version = "0.1.0"
description = "Agent Census pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasketch>=1.6",
    "duckdb>=1.1",
    "hdbscan>=0.8.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyarrow>=17",
    "pyyaml>=6",
    "umap-learn>=0.5.6",
    "zstandard>=0.23",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=6.1"]

[project.scripts]
census = "pipeline.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
