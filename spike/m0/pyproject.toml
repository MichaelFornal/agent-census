[project]
name = "m0-spike"
version = "0.0.0"
description = "Agent Census M0 measurement spike (throwaway)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasketch>=2.0.0",
    "einops>=0.8.2",
    "httpx>=0.27",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
